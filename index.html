.hero-head p{ color:var(--muted); font-size:clamp(16px,2vw,19px); margin:0 auto; max-width:62ch; }

.paths-cue{ text-align:center; color:var(--gold); font-size:12px; letter-spacing:.2em; text-transform:uppercase; font-weight:700; margin:0 0 18px; }
.path-motif{ position:absolute; top:-10px; right:-16px; width:152px; height:auto; opacity:.12; pointer-events:none; z-index:0; }
.path > :not(.path-motif){ position:relative; z-index:1; }

/* TWO PATHS */
.paths{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
@media(max-width:860px){ .paths{ grid-template-columns:1fr; } }
.path{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:20px; padding:38px 34px; display:flex; flex-direction:column; transition:.2s; overflow:hidden; }
.path:hover{ transform:translateY(-3px); border-color:var(--gold-line); }
.path::before{ content:""; position:absolute; inset:0 0 auto 0; height:4px;
  background:linear-gradient(90deg, var(--gold-soft), var(--gold) 45%, var(--red)); }
.path .num{ font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin-bottom:14px; }
.path h2{ font-size:28px; font-weight:700; margin:0 0 12px; }
.path > p{ color:var(--muted); font-size:15.5px; margin:0 0 22px; flex:0 0 auto; }
.path .spacer{ flex:1 1 auto; }
.checks{ list-style:none; padding:0; margin:0 0 26px; display:flex; flex-direction:column; gap:11px; }
.checks li{ display:flex; gap:11px; font-size:14.5px; color:var(--white); align-items:flex-start; }
.check{ flex:0 0 auto; width:20px; height:20px; border-radius:50%; margin-top:1px;
  background:rgba(45,212,106,0.16); display:grid; place-items:center; color:var(--green-soft); }
.path .btn{ width:100%; }

/* SECTIONS */
.section{ padding:72px 0; border-top:1px solid var(--line); }
.section-head{ max-width:62ch; margin:0 auto 36px; text-align:center; }
.section-head h2{ font-size:clamp(28px,4vw,42px); font-weight:700; margin:13px 0 12px; }
.section-head p{ color:var(--muted); font-size:16px; }
.section-head .big-q{ color:#FFFFFF; font-size:clamp(24px,4vw,42px); font-weight:800; line-height:1.12; margin:0 0 14px; }
.section-head .gold-line{ color:var(--gold); font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:clamp(19px,2.6vw,28px); margin:0 0 14px; }
.section-head .formula{ font-size:clamp(15px,2vw,19px); margin:0 0 14px; line-height:1.5; }
.section-head .formula .term{ color:#FFFFFF; font-style:italic; font-weight:600; }
.section-head .formula .op{ color:var(--gold); font-weight:800; padding:0 2px; }
.section-head .formula .eq{ color:var(--green-soft); font-weight:700; font-style:italic; }

/* CREDIT CARDS */
.cards{ display:grid; grid-template-columns:1.05fr 1fr; gap:22px; align-items:stretch; }
@media(max-width:820px){ .cards{ grid-template-columns:1fr; } }

/* 3 C's */
.threecs{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:30px; }
@media(max-width:680px){ .threecs{ grid-template-columns:1fr; } }
.cc{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; text-align:center; }
.cc-letter{ font-family:'Playfair Display',Georgia,serif; font-size:34px; font-weight:800; color:var(--muted); line-height:1; margin-bottom:8px; }
.cc-name{ font-weight:700; font-size:17px; color:var(--white); margin-bottom:5px; }
.cc-desc{ font-size:13px; color:var(--muted); }
.cc-active{ border-color:var(--gold); background:rgba(230,185,71,0.06); box-shadow:0 0 22px rgba(230,185,71,0.28); }
.cc-active .cc-letter,.cc-active .cc-name{ color:var(--gold); }

/* TESTIMONIALS */
.tcards{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
@media(max-width:820px){ .tcards{ grid-template-columns:1fr; } }
.tcard{ background:var(--surface); border:1.5px solid rgba(230,185,71,0.45); border-radius:18px; padding:28px 26px; display:flex; flex-direction:column; box-shadow:0 0 0 1px rgba(230,185,71,0.14), 0 0 26px rgba(230,185,71,0.28); }
.stars{ display:flex; gap:3px; margin-bottom:14px; font-size:18px; line-height:1; }
.tcard .quote{ font-size:15px; line-height:1.7; color:#E2E8F3; margin:0 0 18px; flex:1 1 auto; font-style:italic; }
.tcard .who{ font-weight:700; color:var(--gold); font-size:14px; }
.tcard .who span{ display:block; color:var(--muted); font-weight:500; font-size:12.5px; margin-top:3px; font-style:normal; }

/* CONTACT */
.contact-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
@media(max-width:760px){ .contact-grid{ grid-template-columns:1fr; } }
.contact-card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:30px; display:flex; flex-direction:column; }
.contact-card h3{ font-size:21px; font-weight:700; margin:0 0 8px; }
.contact-card p{ color:var(--muted); font-size:15px; margin:0 0 22px; flex:1 1 auto; }
.contact-card .btn{ align-self:flex-start; }

/* SMARTCREDIT — GREEN GLOW + $1 / 7 DAYS */
.glow{ position:relative; border:1.5px solid var(--green); border-radius:18px; padding:32px;
  background:linear-gradient(180deg, rgba(45,212,106,0.07), rgba(16,42,87,0.55));
  box-shadow:0 0 0 1px rgba(45,212,106,0.22), 0 0 30px rgba(45,212,106,0.3), inset 0 0 24px rgba(45,212,106,0.07);
  animation:pulse 3.2s ease-in-out infinite; display:flex; flex-direction:column; }
.glow h3{ font-size:24px; font-weight:700; margin:0 0 8px; }
.glow .lead{ color:#C9D6EC; font-size:15px; margin:0 0 16px; flex:1 1 auto; }
.price{ display:flex; align-items:baseline; gap:10px; margin-bottom:20px; }
.price .amount{ font-family:'Playfair Display',Georgia,serif; font-size:42px; font-weight:800; color:#fff; line-height:1; }
.price .amount .cur{ font-size:0.5em; font-weight:700; vertical-align:0.7em; margin-right:1px; }
.price .sub{ color:var(--green-soft); font-size:14px; font-weight:600; }
@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 1px rgba(45,212,106,0.20), 0 0 24px rgba(45,212,106,0.24), inset 0 0 20px rgba(45,212,106,0.06); }
  50%{ box-shadow:0 0 0 1px rgba(45,212,106,0.42), 0 0 44px rgba(45,212,106,0.5), inset 0 0 28px rgba(45,212,106,0.12); }
}

/* GOLD GLOW — black box, yellow glowing frame */
.glow-gold{ position:relative; border:1.5px solid var(--gold); border-radius:18px; padding:32px;
  background:#070709; color:#fff; display:flex; flex-direction:column;
  box-shadow:0 0 0 1px rgba(230,185,71,0.25), 0 0 30px rgba(230,185,71,0.34), inset 0 0 24px rgba(230,185,71,0.05);
  animation:pulseGold 3.4s ease-in-out infinite; }
.glow-gold h3{ font-size:24px; font-weight:700; margin:0 0 8px; color:#fff; }
.glow-gold .lead{ color:#FFFFFF; font-size:15px; margin:0 0 22px; flex:1 1 auto; }
@keyframes pulseGold{
  0%,100%{ box-shadow:0 0 0 1px rgba(230,185,71,0.22), 0 0 24px rgba(230,185,71,0.26), inset 0 0 20px rgba(230,185,71,0.05); }
  50%{ box-shadow:0 0 0 1px rgba(230,185,71,0.46), 0 0 46px rgba(230,185,71,0.58), inset 0 0 28px rgba(230,185,71,0.10); }
}
@media(prefers-reduced-motion:reduce){ .glow,.glow-gold,.disc-card,.hero .orb,.rot,.msg,.typing-dots i,.scroll-cue .chev{ animation:none; } }

/* AI ADVISOR */
.chat{ background:var(--navy-2); border:1px solid var(--line); border-radius:20px; overflow:hidden; }
.chat-top{ display:flex; align-items:center; gap:13px; padding:20px 24px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(230,185,71,0.07), transparent); }
.chat-top .name{ font-family:'Playfair Display',serif; font-weight:700; font-size:18px; }
.chat-top .role{ font-size:12.5px; color:var(--muted); }
.chat-tools{ margin-left:auto; display:flex; align-items:center; gap:13px; }
.chat-reset{ background:transparent; border:1px solid var(--gold-line); color:var(--muted); font-size:12px;
  font-weight:600; padding:6px 12px; border-radius:8px; cursor:pointer; font-family:'Inter',sans-serif; transition:.16s; }
.chat-reset:hover{ border-color:var(--gold); color:var(--gold); }
.dot{ width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 9px var(--green); }
.chat-disc{ font-size:12.5px; color:#C0CFE8; padding:11px 24px; background:rgba(224,72,90,0.10); border-bottom:1px solid var(--line); }
.chat-disc b{ color:var(--gold-soft); font-weight:700; }
.chat-body{ height:380px; overflow-y:auto; padding:22px 24px; display:flex; flex-direction:column; gap:14px; }
.chat-body::-webkit-scrollbar{ width:8px; }
.chat-body::-webkit-scrollbar-thumb{ background:rgba(157,178,214,0.25); border-radius:4px; }
.chat-body::-webkit-scrollbar-track{ background:transparent; }
.msg{ max-width:82%; padding:13px 17px; border-radius:15px; font-size:15px; white-space:pre-wrap; animation:msgIn .25s ease; }
.msg.bot{ align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px; }
.msg.me{ align-self:flex-end; background:linear-gradient(135deg,var(--gold),#cda231); color:#0A1B3D; font-weight:500; border-bottom-right-radius:5px; }
@keyframes msgIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
.typing-dots{ display:inline-flex; gap:5px; align-items:center; padding:2px 0; }
.typing-dots i{ width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite ease-in-out; }
.typing-dots i:nth-child(2){ animation-delay:.18s; }
.typing-dots i:nth-child(3){ animation-delay:.36s; }
@keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:1; transform:translateY(-3px); } }
.chips{ display:flex; flex-wrap:wrap; gap:9px; padding:0 24px 14px; }
.chip{ font-size:13px; color:var(--gold); border:1px solid var(--gold-line); border-radius:999px;
  padding:8px 14px; cursor:pointer; background:transparent; font-family:'Inter',sans-serif; transition:.16s; }
.chip:hover{ border-color:var(--gold); background:rgba(230,185,71,0.09); }
.chat-input{ display:flex; gap:10px; padding:16px 24px; border-top:1px solid var(--line); }
.chat-input input{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px;
  color:var(--white); padding:13px 15px; font-size:15px; font-family:'Inter',sans-serif; outline:none; }
.chat-input input:focus{ border-color:var(--gold); }
.chat-input input::placeholder{ color:#7E92B6; }
.send{ background:transparent; color:var(--gold); border:2px solid var(--gold); border-radius:12px;
  padding:0 22px; font-weight:800; cursor:pointer; font-family:'Inter',sans-serif; transition:.18s;
  box-shadow:0 0 12px rgba(230,185,71,0.38); }
.send:hover{ background:rgba(230,185,71,0.12); box-shadow:0 0 22px rgba(230,185,71,0.6); }
.send:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }

/* COME AS YOU ARE — path strip under the top bar */
.cayu-strip{ background:#000; border-bottom:1px solid rgba(75,156,211,0.35); padding:16px 0 18px; text-align:center; }
.cayu-motto{ font-family:'Inter',sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:.14em;
  color:var(--blue); font-size:clamp(11px,2.9vw,17px); white-space:nowrap; margin:0 0 13px; text-shadow:0 0 14px rgba(75,156,211,0.5); }
.cayu-steps{ display:flex; justify-content:center; align-items:stretch; gap:10px; flex-wrap:wrap; list-style:none; margin:0; padding:0; }
.cayu-step{ display:flex; align-items:center; gap:10px; text-align:left; padding:8px 14px; border-radius:10px; cursor:pointer;
  border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--white); font-family:'Inter',sans-serif; transition:.18s; }
.cayu-step:hover{ border-color:var(--gold); }
.cayu-step .n{ flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800;
  border:1.5px solid var(--muted); color:var(--muted); }
.cayu-step .t{ display:block; font-size:13.5px; font-weight:700; line-height:1.25; }
.cayu-step .s{ display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); line-height:1.3; }
.cayu-step.here{ border-color:var(--gold); background:rgba(230,185,71,0.08); box-shadow:0 0 14px rgba(230,185,71,0.28); }
.cayu-step.here .n{ border-color:var(--gold); background:var(--gold); color:#0A1B3D; }
.cayu-step.here .s{ color:var(--gold); }
.cayu-step.blue .n{ border-color:var(--blue); color:var(--blue-soft); }
.cayu-step.blue .s{ color:var(--blue-soft); }
.cayu-step.blue:hover{ border-color:var(--blue); box-shadow:0 0 16px rgba(75,156,211,0.45); }
@media(max-width:700px){
  .cayu-steps{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cayu-step{ padding:8px 10px; gap:8px; }
  .cayu-step .t{ font-size:12.5px; }
  .cayu-step .s{ font-size:10px; }
}

/* WHEN YOU ARE READY — the referral to Come As You Are (Carolina blue, lights up when touched) */
.ready-card{ max-width:860px; margin:0 auto; background:#000; border:1.5px solid rgba(75,156,211,0.55); border-radius:18px;
  padding:36px 34px; text-align:center; transition:.25s; box-shadow:0 0 18px rgba(75,156,211,0.18); }
.ready-card:hover{ border-color:var(--blue); box-shadow:0 0 0 1px rgba(75,156,211,0.4), 0 0 44px rgba(75,156,211,0.55), inset 0 0 24px rgba(75,156,211,0.08); }
.ready-motto{ font-family:'Inter',sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:.12em; color:var(--blue);
  font-size:clamp(11px,2.7vw,16px); white-space:nowrap; margin:0 0 14px; }
.ready-card h3{ font-size:clamp(24px,3.6vw,32px); font-weight:700; color:#fff; margin:0 0 12px; }
.ready-card h3 em{ color:var(--gold); font-style:italic; }
.ready-card .lead{ color:#E2E8F3; font-size:15.5px; max-width:60ch; margin:0 auto 22px; }
.ready-ways{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:0 0 26px; text-align:left; }
@media(max-width:700px){ .ready-ways{ grid-template-columns:1fr; } .ready-card{ padding:28px 20px; } }
.ready-way{ border:1px solid var(--line); border-radius:12px; padding:16px 16px; }
.ready-way .k{ font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--blue-soft); margin-bottom:5px; }
.ready-way .v{ font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:18px; color:var(--gold); margin-bottom:5px; }
.ready-way p{ margin:0; font-size:13.5px; color:#C9D6EC; line-height:1.55; }
.btn-blue{ color:var(--blue-soft); border-color:var(--blue);
  box-shadow:0 0 14px rgba(75,156,211,0.5), inset 0 0 10px rgba(75,156,211,0.08); }
.btn-blue:hover{ transform:translateY(-2px); background:rgba(75,156,211,0.14);
  box-shadow:0 0 26px rgba(75,156,211,0.75), inset 0 0 14px rgba(75,156,211,0.14); }
.ready-fine{ font-size:12.5px; color:var(--muted); margin:18px auto 0; max-width:60ch; }
.team{ font-style:italic; font-weight:700; color:var(--gold); }

/* FAMILY PROMISE BAND */
.promise-band{ background:#000000; border-top:1px solid var(--gold-line); border-bottom:1px solid var(--gold-line);
  padding:38px 24px; text-align:center; }
.promise-quote{ font-family:'Playfair Display',Georgia,serif; font-style:italic; font-weight:600;
  font-size:clamp(18px,3vw,24px); line-height:1.4; color:var(--white); max-width:760px; margin:0 auto; }
.promise-sig{ font-size:14px; margin:10px 0 14px; }
.promise-band a.promise-link{ display:inline-block; font-size:13px; font-weight:600; color:#6FB7E6; border-bottom:1px solid #4B9CD3;
  padding-bottom:2px; letter-spacing:0.04em; text-shadow:0 0 12px rgba(75,156,211,0.45); }
.promise-band a.promise-link:hover{ color:#fff; text-shadow:0 0 18px rgba(75,156,211,0.85); }

/* FOOTER (matches Your Credit Advocate) */
.footer{ background:#070709; }
.disc-band{ background:#070709; padding:42px 0 34px; }
.disc-card{ max-width:1000px; margin:0 auto; background:#0B0B11; border:1.5px solid var(--red-deep); border-radius:16px;
  padding:24px 30px; box-shadow:0 0 0 1px rgba(200,16,46,0.25), 0 0 30px rgba(200,16,46,0.42), inset 0 0 22px rgba(200,16,46,0.06);
  animation:pulseRed 3.6s ease-in-out infinite; }
.disc-title{ display:flex; align-items:center; gap:9px; font-family:'Playfair Display',Georgia,serif; font-weight:700;
  font-size:18px; color:#fff; margin:0 0 11px; }
.disc-title svg{ color:var(--gold); flex:0 0 auto; }
.disc-card p{ margin:0; font-size:13px; line-height:1.75; color:#E2E8F3; }
@keyframes pulseRed{
  0%,100%{ box-shadow:0 0 0 1px rgba(200,16,46,0.22), 0 0 24px rgba(200,16,46,0.30), inset 0 0 20px rgba(200,16,46,0.05); }
  50%{ box-shadow:0 0 0 1px rgba(200,16,46,0.48), 0 0 46px rgba(200,16,46,0.62), inset 0 0 28px rgba(200,16,46,0.10); }
}
.foot-main{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; padding:34px 0 18px; flex-wrap:wrap; }
.foot-name{ font-family:'Playfair Display',serif; font-weight:700; color:var(--gold); font-size:15px; letter-spacing:0.16em; text-transform:uppercase; }
.foot-contact{ font-size:13px; color:#8C97AE; margin-top:7px; }
.foot-links{ display:flex; gap:26px; flex-wrap:wrap; }
.foot-links a{ font-size:13.5px; color:#C4CDDF; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
.foot-links a:hover{ color:var(--gold); }
.foot-bottom{ display:flex; justify-content:space-between; gap:16px; padding:16px 0 42px; flex-wrap:wrap;
  border-top:1px solid rgba(157,178,214,0.08); margin-top:6px; }
.foot-bottom span{ font-size:12px; color:#6F7A91; }
/* MODAL (footer pop-ups) */
.modal-overlay{ position:fixed; inset:0; z-index:100; background:rgba(4,8,18,0.8); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; padding:24px; }
.modal{ background:var(--navy-2); border:1px solid var(--gold-line); border-radius:18px; max-width:640px; width:100%;
  max-height:85vh; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,0.55); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:22px 26px; border-bottom:1px solid var(--line); }
.modal-head h3{ font-family:'Playfair Display',Georgia,serif; font-size:23px; font-weight:700; color:var(--gold); margin:0; }
.modal-close{ background:transparent; border:1px solid var(--gold-line); color:var(--white); width:34px; height:34px;
  border-radius:9px; cursor:pointer; font-size:20px; line-height:1; display:grid; place-items:center; }
.modal-close:hover{ border-color:var(--gold); color:var(--gold); }
.modal-body{ overflow-y:auto; padding:24px 26px 28px; }
.modal-body h4{ font-family:'Inter',sans-serif; font-size:14px; font-weight:700; color:var(--gold-soft); margin:18px 0 7px; }
.modal-body h4:first-child{ margin-top:0; }
.modal-body p{ font-size:14px; line-height:1.7; color:#D7DEEC; margin:0 0 12px; }

/* LOADER (entrance screen) */
.loader{ position:fixed; inset:0; z-index:200; background:var(--navy); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px; transition:opacity .5s ease; }
.loader--out{ opacity:0; pointer-events:none; }
.loader-mark{ width:60px; height:60px; border-radius:14px; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--gold),#c79a26); color:#0A1B3D; font-weight:800; font-size:28px; font-family:'Inter',sans-serif; }
.loader-name{ font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:22px; color:#fff; }
.loader-track{ width:min(260px,70vw); height:6px; background:rgba(157,178,214,0.18); border-radius:99px; overflow:hidden; }
.loader-fill{ height:100%; background:linear-gradient(90deg, var(--gold-soft), var(--gold) 50%, var(--red)); border-radius:99px; transition:width .12s linear; }
.loader-text{ font-size:13px; color:var(--muted); letter-spacing:.04em; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
@media(max-width:560px){
  .hero{ padding:54px 0 26px; }
  .section{ padding:52px 0; }
  .path{ padding:30px 24px; }
  .glow,.glow-gold{ padding:26px 22px; }
  .chat-body{ height:340px; }
  .disc-card{ padding:20px 20px; }
  .foot-main{ gap:18px; }
}

/* BUILD BUSINESS CREDIT — baby steps */
.build-first{ max-width:820px; margin:0 auto 22px; display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  background:#070709; border:1px solid var(--gold-line); border-radius:16px; padding:20px 24px; }
.build-first p{ margin:0; font-size:14.5px; color:#D7DEEC; flex:1 1 320px; }
.build-first b{ color:var(--gold-soft); }
.build-prog{ max-width:820px; margin:0 auto 18px; }
.build-prog-row{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-bottom:8px; }
.build-prog-row b{ color:var(--white); font-weight:700; }
.build-track{ height:6px; background:rgba(157,178,214,0.18); border-radius:99px; overflow:hidden; }
.build-fill{ height:100%; background:linear-gradient(90deg, var(--green), var(--green-soft)); border-radius:99px; transition:width .3s ease; }
.steps{ max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:14px; list-style:none; padding:0; }
.step{ background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; transition:border-color .2s ease, box-shadow .2s ease; }
.step:hover{ border-color:var(--gold); box-shadow:0 0 22px rgba(230,185,71,0.26); }
.step.open{ border-color:var(--gold); box-shadow:0 0 0 1px rgba(230,185,71,0.20), 0 0 28px rgba(230,185,71,0.30); }
.step-head{ width:100%; display:flex; align-items:center; gap:16px; padding:18px 22px; background:transparent; border:none;
  color:inherit; cursor:pointer; text-align:left; font-family:'Inter',system-ui,sans-serif; }
.step-num{ flex:0 0 auto; width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
  border:2px solid var(--gold); color:var(--gold); font-weight:800; font-size:16px; }
.step.done .step-num{ background:rgba(45,212,106,0.16); border-color:var(--green); color:var(--green-soft); }
.step-title{ flex:1 1 auto; min-width:0; }
.step-title .t{ display:block; font-family:'Playfair Display',Georgia,serif; font-size:19px; font-weight:700; line-height:1.25; color:var(--white); }
.step-title .s{ display:block; font-size:12.5px; color:var(--muted); margin-top:3px; letter-spacing:.02em; }
.step-chev{ flex:0 0 auto; width:20px; height:20px; color:var(--gold); transition:transform .2s ease; }
.step.open .step-chev{ transform:rotate(180deg); }
.step-body{ padding:2px 22px 24px 78px; }
.step-body p{ color:#D7DEEC; font-size:15px; margin:0 0 14px; }
.step-body .do{ font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:0 0 10px; }
.step-body .checks{ margin:0 0 16px; }
.step-watch{ display:flex; gap:10px; align-items:flex-start; background:rgba(224,72,90,0.10); border:1px solid rgba(224,72,90,0.35);
  border-radius:12px; padding:12px 14px; font-size:14px; color:#F1D9DD; margin:0 0 16px; }
.step-watch svg{ flex:0 0 auto; color:var(--red); margin-top:3px; }
.step-actions{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
.btn-sm{ padding:10px 18px; font-size:14px; }
.step-body .partner-note{ font-size:12.5px; line-height:1.5; color:var(--muted); margin:16px 0 0; }
.done-btn{ display:inline-flex; align-items:center; gap:8px; margin-top:18px; background:transparent; border:1px solid rgba(45,212,106,0.5);
  color:var(--green-soft); font-family:'Inter',system-ui,sans-serif; font-size:13.5px; font-weight:700; padding:9px 16px; border-radius:10px; cursor:pointer; transition:.16s; }
.done-btn:hover{ background:rgba(45,212,106,0.12); border-color:var(--green); }
.build-real{ max-width:820px; margin:24px auto 0; font-size:14px; color:var(--muted); text-align:center; }
.build-real b{ color:var(--white); }
.build-src{ max-width:820px; margin:10px auto 0; font-size:12px; color:#7E92B6; text-align:center; }
@media(max-width:560px){
  .step-head{ padding:16px 16px; gap:13px; }
  .step-num{ width:36px; height:36px; font-size:15px; }
  .step-title .t{ font-size:17.5px; }
  .step-body{ padding:2px 16px 20px; }
  .step-actions .btn{ width:100%; }
  .build-first{ padding:18px 18px; }
  .build-first .btn{ width:100%; }
}

  const el = document.getElementById(id);

}

function Arrow() {
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
      <line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" />
    </svg>
  );
}
function Check() {
  return (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="20 6 9 17 4 12" />
    </svg>
  );
}
function Stars({ rating }) {
  if (!rating) return null;
  return (
    <div className="stars" aria-label={`${rating} out of 5 stars`}>
      {[1, 2, 3, 4, 5].map((n) => (
        <span key={n} style={{ color: n <= rating ? "var(--gold)" : "rgba(157,178,214,0.28)" }}>★</span>
      ))}
    </div>
  );
}
function RotatingWord({ words, interval = 2100 }) {
  const [i, setI] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setI((p) => (p + 1) % words.length), interval);
    return () => clearInterval(id);
  }, [words.length, interval]);
  return <span className="rot" key={i}>{words[i]}</span>;
}

function Modal({ data, onClose }) {
  useEffect(() => {
    if (!data) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [data, onClose]);
  if (!data) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} role="dialog" aria-modal="true">
        <div className="modal-head">
          <h3>{data.title}</h3>
          <button className="modal-close" onClick={onClose} aria-label="Close">×</button>
        </div>
        <div className="modal-body">
          {data.sections.map((s, i) => (
            <div key={i}>
              {s.h ? <h4>{s.h}</h4> : null}
              {s.p.map((para, j) => <p key={j}>{para}</p>)}
            </div>
          ))}
          {data.contact ? (
            <a className="btn btn-gold" href={`mailto:${CONTACT.email}`} style={{ marginTop: 6 }}>Email us</a>
          ) : null}
        </div>
      </div>
    </div>
  );
}

function QuickAnswers() {
  const [pick, setPick] = useState(null);
  const [copied, setCopied] = useState(false);

  function copyStarter() {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2200); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(AI_STARTER).then(done, done);
        return;
      }
    } catch (e) { /* fall through */ }
    done();
  }

  return (
    <div className="qa">
      <div className="qa-title">Quick answers</div>
      <div className="chips qa-chips">
        {STARTERS.map((q) => (
          <button key={q} className={`chip${pick === q ? " chip-on" : ""}`} onClick={() => setPick(pick === q ? null : q)} aria-pressed={pick === q}>{q}</button>
        ))}
      </div>
      {pick ? <div className="qa-a" aria-live="polite">{STARTER_ANSWERS[pick]}</div> : null}
      <div className="qa-more">
        <p><b>More questions?</b> Ask your favorite AI, such as ChatGPT, Claude, or Gemini. Copy our starter, paste it in, and fill in the brackets.</p>
        <button className="btn btn-sm" onClick={copyStarter}>{copied ? "Copied" : "Copy the starter"}</button>
      </div>
      <p className="qa-fine">AI can make mistakes. Double-check what it tells you, and never type your Social Security or account numbers into an AI tool.</p>
    </div>
  );
}

function BuildCredit() {
  const [open, setOpen] = useState(0);
  const [done, setDone] = useState([]);
  const KEY = "yba_build_steps_done";

  // Remember which steps a visitor has finished (on their own device only).
  useEffect(() => {
    try {
      const saved = JSON.parse(window.localStorage.getItem(KEY) || "[]");
      if (Array.isArray(saved)) setDone(saved.filter((x) => typeof x === "string"));
    } catch (e) { /* storage unavailable: the checklist still works for this visit */ }
  }, []);

  function toggleDone(id, index) {
    const wasDone = done.includes(id);
    const next = wasDone ? done.filter((x) => x !== id) : [...done, id];
    setDone(next);
    try { window.localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) { /* ignore */ }
    if (!wasDone) setOpen(index < BUILD_STEPS.length - 1 ? index + 1 : -1);
  }

  const total = BUILD_STEPS.length;
  const count = BUILD_STEPS.filter((s) => done.includes(s.id)).length;

  return (
    <section className="section" id="build">
      <div className="wrap">
        <div className="section-head">
          <span className="eyebrow">Path 2 &middot; Do it yourself &middot; baby steps</span>
          <h2>Build your business credit.</h2>
          <p>Business credit is a credit file in your company's name, separate from your personal credit. Here are the steps, in order. Take one at a time.</p>
        </div>

        <div className="build-first">
          <p><b>Before Step 1:</b> you need an LLC or corporation. A sole proprietorship (a business run in your own name, with no company formed) cannot build credit that is separate from you.</p>
          <a className="btn btn-sm" onClick={() => scrollToId("start")}>Form my business first</a>
        </div>

        <div className="addr-tip">
          <div className="addr-tip-head"><Warn /> Address tip: no P.O. Boxes or UPS Store mailboxes</div>
          <p>Banks and lenders want your business at a real street address. A P.O. Box will not work for a business bank account. A UPS Store or similar mailbox is a <b>PMB</b> (Private Mailbox) at a <b>CMRA</b> (Commercial Mail Receiving Agency), and many lenders flag those addresses. Use an office, your home, or a virtual office in a real office building that is not registered as a CMRA.</p>
          {CREDIT_LINKS.officeAddress.url ? (
            <>
              <a className="btn btn-sm" href={CREDIT_LINKS.officeAddress.url} target="_blank" rel="noopener noreferrer">{CREDIT_LINKS.officeAddress.label} <Arrow /></a>
              <p className="addr-fine">Partner link: we may earn a commission if you sign up, at no extra cost to you.</p>
            </>
          ) : null}
        </div>

        <div className="build-prog" aria-live="polite">
          <div className="build-prog-row">
            <span><b>{count} of {total}</b> steps done</span>
            <span>Your checkmarks are saved on this device.</span>
          </div>
          <div className="build-track"><div className="build-fill" style={{ width: `${Math.round((count / total) * 100)}%` }} /></div>
        </div>

        <ol className="steps">
          {BUILD_STEPS.map((s, i) => {
            const isOpen = open === i;
            const isDone = done.includes(s.id);
            const links = (s.links || []).filter((l) => l && l.url);
            const hasPartner = links.some((l) => l.partner);
            return (
              <li key={s.id} className={`step${isOpen ? " open" : ""}${isDone ? " done" : ""}`}>
                <button
                  className="step-head"
                  onClick={() => setOpen(isOpen ? -1 : i)}
                  aria-expanded={isOpen}
                  aria-controls={`step-body-${s.id}`}
                >
                  <span className="step-num" aria-hidden="true">{isDone ? <Check /> : i + 1}</span>
                  <span className="step-title">
                    <span className="t">Step {i + 1}: {s.title}</span>
                    <span className="s">{isDone ? "Done" : s.tag}</span>
                  </span>
                  <svg className="step-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9" /></svg>
                </button>
                {isOpen && (
                  <div className="step-body" id={`step-body-${s.id}`}>
                    {s.why.map((para, j) => <p key={j}>{para}</p>)}
                    <div className="do">Do this</div>
                    <ul className="checks">
                      {s.todo.map((t, j) => (
                        <li key={j}><span className="check"><Check /></span><span>{t}</span></li>
                      ))}
                    </ul>
                    {s.watch ? <div className="step-watch"><Warn /><span>{s.watch}</span></div> : null}
                    {links.length > 0 && (
                      <div className="step-actions">
                        {links.map((l, j) => (
                          <a key={j} className="btn btn-sm" href={l.url} target="_blank" rel="noopener noreferrer">{l.label} <Arrow /></a>
                        ))}
                      </div>
                    )}
                    {hasPartner ? <p className="partner-note">Partner link: we may earn a commission if you sign up, at no extra cost to you.</p> : null}
                    <button className="done-btn" onClick={() => toggleDone(s.id, i)}>
                      {isDone ? "Undo: mark as not done" : <><Check /> I finished this step</>}
                    </button>
                  </div>
                )}
              </li>
            );
          })}
        </ol>

        <p className="build-real"><b>Real talk:</b> business credit takes months to build, not days. Nobody can promise you a score, an approval, or a dollar amount. Be careful with anyone who does.</p>
        <p className="build-src">Steps based on guidance from the IRS, the U.S. Small Business Administration, and Dun &amp; Bradstreet. Last reviewed October 2026. Education only, not legal, tax, or financial advice.</p>
      </div>
    </section>
  );
}

function BusinessFundingPortal() {
  const [modal, setModal] = useState(null);
  const [progress, setProgress] = useState(0);
  const [fadeOut, setFadeOut] = useState(false);
  const [gone, setGone] = useState(false);

  useEffect(() => {
    const start = performance.now();
    const dur = 1700;
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / dur);
      setProgress(Math.round(t * 100));
      if (t < 1) raf = requestAnimationFrame(tick);
      else { setFadeOut(true); setTimeout(() => setGone(true), 500); }
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  useEffect(() => {
    document.title = BRAND_NAME;
    const fav = "data:image/svg+xml," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'><rect width='100' height='110' rx='16' fill='#0A1B3D'/><path d='M50 12 L84 24 V52 C84 76 69 90 50 99 C31 90 16 76 16 52 V24 Z' fill='none' stroke='#E6B947' stroke-width='7' stroke-linejoin='round'/><path d='M34 60 L46 73 L68 46' fill='none' stroke='#E6B947' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    );
    let link = document.querySelector("link[rel='icon']");
    if (!link) { link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
    link.setAttribute("type", "image/svg+xml");
    link.setAttribute("href", fav);
  }, []);

  return (
    <div className="bfp">
      <style>{STYLES}</style>

      {!gone && (
        <div className={`loader ${fadeOut ? "loader--out" : ""}`}>
          <ShieldMark size={60} />
          <div className="loader-name">{BRAND_NAME}</div>
          <div className="loader-track"><div className="loader-fill" style={{ width: `${progress}%` }} /></div>
          <div className="loader-text">Loading your portal… {progress}%</div>
        </div>
      )}

      {/* NAV */}
      <nav className="nav">
        <div className="wrap nav-inner">
          <div className="brand"><ShieldMark size={36} />{BRAND_NAME}</div>
          <div className="nav-links">
            <a onClick={() => scrollToId("start")}>Get Started</a>
            <a onClick={() => scrollToId("build")}>Build Credit</a>
            <a onClick={() => scrollToId("credit")}>Your Credit</a>
            <a onClick={() => scrollToId("advisor")}>Quick Answers</a>
            <a onClick={() => scrollToId("testimonials")}>Reviews</a>
            <a onClick={() => scrollToId("contact")}>Contact</a>
            <a className="nav-cayu" onClick={() => scrollToId("ready")}>Come As You Are</a>
          </div>
        </div>
      </nav>

      {/* COME AS YOU ARE — where this site sits on the path */}
      <div className="cayu-strip" aria-label="The Come As You Are path">
        <div className="wrap">
          <p className="cayu-motto">Come as you are. Leave as an owner.</p>
          <ol className="cayu-steps">
            {PATHWAY.map((s) => {
              const cls = `cayu-step${s.here ? " here" : ""}${s.blue ? " blue" : ""}`;
              const inner = (<><span className="n">{s.n}</span><span><span className="t">{s.title}</span><span className="s">{s.sub}</span></span></>);
              return (
                <li key={s.n} style={{ display: "contents" }}>
                  {s.href
                    ? <a className={cls} href={s.href} target="_blank" rel="noopener noreferrer">{inner}</a>
                    : <a className={cls} onClick={() => scrollToId(s.scroll)}>{inner}</a>}
                </li>
              );
            })}
          </ol>
        </div>
      </div>

      {/* HERO + TWO PATHS */}
      <header className="hero" id="start">
        <div className="orb orb1" />
        <div className="orb orb2" />
        <div className="wrap">
          <div className="hero-head">
            <div className="trust">
              <span className="trust-text">Helping thousands of new and seasoned business owners get the funding they deserve</span>
            </div>
            <h1>Let's build your<br /><RotatingWord words={["LLC", "business credit", "legacy"]} /></h1>
            <p>From forming your entity to funding the business you already have — wherever you are, we can help.</p>
          </div>

          <p className="paths-cue">Where are you right now?</p>
          <div className="paths three">
            {/* PATH 1 — START A BUSINESS */}
            <div className="path">
              <BuildingsMotif />
              <div className="num">Path 1 · Start a business</div>
              <h2>I need to form my business</h2>
              <p>New to this? Start here. Forming an LLC creates a legal wall between you and your business — protecting your personal name and assets. It's fast, affordable, and the very first step every owner takes.</p>
              <ul className="checks">
                <li><span className="check"><Check /></span>Separate your personal and business life</li>
                <li><span className="check"><Check /></span>Protect your name and personal assets</li>
                <li><span className="check"><Check /></span>Build the foundation for business credit</li>
              </ul>
              <div className="spacer" />
              <a className="btn btn-gold" href={LINKS.formBusiness} target="_blank" rel="noopener noreferrer">
                Form my business <Arrow />
              </a>
            </div>

            {/* PATH 2 — BUILD BUSINESS CREDIT (the 8 steps further down this page) */}
            <div className="path">
              <LadderMotif />
              <div className="num">Path 2 · Build business credit</div>
              <h2>I have a business — build its credit</h2>
              <p>Already have an LLC, but no business credit yet? Follow our free, do-it-yourself steps one at a time, and check each one off as you go.</p>
              <ul className="checks">
                <li><span className="check"><Check /></span>8 baby steps, in order, in plain English</li>
                <li><span className="check"><Check /></span>Your first steps are free: your EIN and your D-U-N-S Number</li>
                <li><span className="check"><Check /></span>Build credit in your company's name, separate from you</li>
              </ul>
              <div className="spacer" />
              <a className="btn btn-gold" onClick={() => scrollToId("build")}>
                Start the 8 steps <Arrow />
              </a>
            </div>

            {/* PATH 3 — FUNDING */}
            <div className="path">
              <CoinsMotif />
              <div className="num">Path 3 · Funding</div>
              <h2>My business is ready — fund it</h2>
              <p>Already have a business? Start with a free assessment. Tell us a little about your business and here's what happens next:</p>
              <ul className="checks">
                <li><span className="check"><Check /></span>Our AI analyzes your business and shows what you qualify for right now</li>
                <li><span className="check"><Check /></span>You get a complimentary consultation with a funding advisor</li>
                <li><span className="check"><Check /></span>Together you build a clear roadmap to funding</li>
              </ul>
              <div className="spacer" />
              <a className="btn btn-gold" href={LINKS.fundingRoadmap} target="_blank" rel="noopener noreferrer">
                Start my free assessment <Arrow />
              </a>
            </div>
          </div>
          <button className="scroll-cue" onClick={() => scrollToId("build")} aria-label="Scroll down to see more options">
            <span>Keep scrolling — see all your options</span>
            <svg className="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9" /></svg>
          </button>
        </div>
      </header>

      {/* BUILD BUSINESS CREDIT — do-it-yourself baby steps */}
      <BuildCredit />

      {/* CREDIT */}
      <section className="section" id="credit">
        <div className="wrap">
          <div className="section-head">
            <p className="formula"><span className="term">Credit</span> <span className="op">+</span> <span className="term">Collateral</span> <span className="op">+</span> <span className="term">Cash Flow</span> <span className="eq">= the 3 C's of funding</span></p>
            <h2 className="big-q">Been denied for a <RotatingWord words={["personal loan", "personal credit card", "business loan", "business credit card"]} /></h2>
          </div>

          <div className="cards">
            {/* SMARTCREDIT — GREEN GLOW + $1 / 7 DAYS */}
            <div className="glow">
              <h3>Pull your 3-bureau credit report</h3>
              <p className="lead">See exactly what lenders see — all three bureaus in one place. The fastest way to know where you stand.</p>
              <a className="btn btn-green" href={LINKS.smartCredit} target="_blank" rel="noopener noreferrer">
                Get my report — $1 for 7 days <Arrow />
              </a>
            </div>

            {/* PERSONAL CREDIT REFERRAL — black box, gold glow, red button, white text */}
            <div className="glow-gold">
              <h3>Credit first? Start at step 1 — free</h3>
              <p className="lead">Your Credit Advocate is our free, do-it-yourself credit site. It gives you an AI prompt to find what is hurting your credit and write your own dispute letters. Work on your credit there, then come back here to start your LLC.</p>
              <a className="btn btn-red" href={LINKS.personalCredit} target="_blank" rel="noopener noreferrer">
                Visit Your Credit Advocate <Arrow />
              </a>
            </div>
          </div>
        </div>
      </section>

      {/* QUICK ANSWERS (no AI on this site) */}
      <section className="section section-tight" id="advisor">
        <div className="wrap">
          <QuickAnswers />
        </div>
      </section>

      {/* WHEN YOU ARE READY — referral to Come As You Are */}
      <section className="section" id="ready">
        <div className="wrap">
          <div className="section-head">
            <span className="eyebrow">When you are ready</span>
            <h2>Your LLC is step 2. The property is the goal.</h2>
            <p>Your Business Advocate is one stop on a bigger path. Once your LLC is started and your funding is in motion, the main site shows you how to get the property.</p>
          </div>
          <div className="ready-card">
            <p className="ready-motto">Come as you are. Leave as an owner.</p>
            <h3>Next stop: <em>Come As You Are</em></h3>
            <p className="lead">Come As You Are is the main site of this path — modern learning, powered by AI. It walks you from where you are today to your first property: two ways to own, and one way to earn.</p>
            <div className="ready-ways">
              <div className="ready-way"><div className="k">Own</div><div className="v">Buy from a county</div><p>Properties a county or a bank already owns and wants sold.</p></div>
              <div className="ready-way"><div className="k">Own</div><div className="v">Buy from an owner</div><p>Off-market houses, with who owns them and how to reach them.</p></div>
              <div className="ready-way"><div className="k">Earn</div><div className="v">Earn interest</div><p>Buy a tax lien and collect interest. Expect interest, not a house.</p></div>
            </div>
            {LINKS.comeAsYouAre ? (
              <a className="btn btn-blue" href={LINKS.comeAsYouAre} target="_blank" rel="noopener noreferrer">
                Go to Come As You Are <Arrow />
              </a>
            ) : (
              <span className="btn btn-blue" style={{ cursor: "default" }} aria-disabled="true">Come As You Are — opening soon</span>
            )}
            <p className="ready-fine">Not there yet? That is fine. Finish your LLC first, and come back to this box if and when you are ready. Education only — no results, funding, or purchases are guaranteed.</p>
          </div>
        </div>
      </section>

      {/* TESTIMONIALS */}
      <section className="section" id="testimonials">
        <div className="wrap">
          <div className="section-head">
            <span className="eyebrow">What people are saying</span>
            <h2>Real entrepreneurs, real beginnings.</h2>
            <p>Here's what business owners have to say about getting started with us.</p>
          </div>
          <div className="tcards">
            {TESTIMONIALS.map((t, i) => (
              <div className="tcard" key={i}>
                <Stars rating={t.rating} />
                <p className="quote">&ldquo;{t.quote}&rdquo;</p>
                <div className="who">{t.initials}<span>{t.source}</span></div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* CONTACT & SUPPORT */}
      <section className="section" id="contact">
        <div className="wrap">
          <div className="section-head">
            <span className="eyebrow">Contact &amp; support</span>
            <h2>Questions? We're right here.</h2>
            <p>Real support, every step of the way — reach out any time and we'll point you in the right direction.</p>
          </div>
          <div className="contact-grid">
            <div className="contact-card">
              <h3>Email our team</h3>
              <p>Send us a note and we'll typically get back to you within one business day.</p>
              <a className="btn btn-gold" href={`mailto:${CONTACT.email}`}>Email us</a>
            </div>
            <div className="contact-card">
              <h3>Need a quick answer now?</h3>
              <p>See our Quick Answers about LLCs, EINs, structures, and business credit, plus a starter you can paste into your favorite AI.</p>
              <a className="btn btn-gold" onClick={() => scrollToId("advisor")}>See Quick Answers</a>
            </div>
          </div>
        </div>
      </section>

      <div className="promise-band">
        <div className="promise-quote">"Helping families keep more, build more, and protect more."</div>
        <div className="promise-sig"><span className="team">{TEAM_NAME}</span></div>
        <a className="promise-link" href="https://discounts-are-us.com" target="_blank" rel="noopener">Start with everyday savings → Discounts-Are-Us.com</a>
      </div>

      {/* FOOTER — matches Your Credit Advocate */}
      <footer className="footer">
        <div className="disc-band" id="disclaimer">
          <div className="wrap">
            <div className="disc-card">
              <h4 className="disc-title"><Warn /> Important Disclaimer</h4>
              <p>This platform provides general business education on entity formation, business structure, and funding readiness. This is NOT legal, tax, or financial advice. No specific results, approvals, or funding amounts are guaranteed. Always review any information with a qualified attorney, CPA, or financial professional before acting on it. Some links on this page are partner or affiliate links, and we may earn a commission at no extra cost to you.</p>
            </div>
          </div>
        </div>
        <div className="wrap">
          <div className="foot-main">
            <div>
              <div className="foot-name">{BRAND_NAME}</div>
              <div className="foot-contact"><a href={`mailto:${CONTACT.email}`} style={{ color: "inherit", textDecoration: "underline" }}>{CONTACT.email}</a> · {CONTACT.location}</div>
            </div>
            <nav className="foot-links">
              <a onClick={() => setModal("privacy")}>Privacy Policy</a>
              <a onClick={() => setModal("terms")}>Terms of Service</a>
              <a onClick={() => setModal("disclaimer")}>Disclaimer</a>
              <a onClick={() => scrollToId("contact")}>Contact Us</a>
            </nav>
          </div>
          <div className="foot-bottom">
            <span>© 2024 {BRAND_NAME}. All rights reserved.</span>
            <span>Educational platform · Not legal advice · No guarantees</span>
          </div>
        </div>
      </footer>

      <Modal data={modal ? LEGAL[modal] : null} onClose={() => setModal(null)} />
    </div>
  );
}


const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(<BusinessFundingPortal />);

  </script>
</body>
